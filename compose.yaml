version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  kong:
    image: kong:latest
    container_name: kong
    environment:
      KONG_DATABASE: "off" # DB-less mode (more suitable for development)
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml # YAML Config
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002" # Kong Manager GUI
      KONG_ADMIN_GUI_URL: "http://localhost:8002" # Kong Manager access URL
    ports:
      - "8000:8000"   # Proxy port
      - "8001:8001"   # Admin API port
      - "8002:8002"   # Kong Manager GUI port
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml:ro

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"   # HTTP API + Web UI
      - "8600:8600/udp" # DNS server
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    environment:
      CONSUL_BIND_INTERFACE: eth0
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 3

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.6
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_HOSTNAME_STRICT_HTTPS: false
      # Import realm configuration on startup
      KEYCLOAK_IMPORT: /opt/keycloak/data/import/keycloak-realm-config.json
    ports:
      - "127.0.0.1:8080:8080"
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak-realm-config.json:/opt/keycloak/data/import/keycloak-realm-config.json:ro
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  rabbitmq_data:
  consul_data:
  postgres_data: