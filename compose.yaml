version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  kong:
    image: kong:latest
    container_name: kong
    environment:
      KONG_DATABASE: "off" # DB-less mode (more suitable for development)
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml # YAML Config
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002" # Kong Manager GUI
      KONG_ADMIN_GUI_URL: "http://localhost:8002" # Kong Manager access URL
    ports:
      - "8000:8000"   # Proxy port
      - "8001:8001"   # Admin API port
      - "8002:8002"   # Kong Manager GUI port
    volumes:
      - ./kong.yml:/usr/local/kong/declarative/kong.yml:ro

volumes:
  rabbitmq_data: