_format_version: "3.0"
_transform: true

services:
  - name: gateway-ab
    url: http://host.docker.internal:3000
    routes:
      - name: gateway-ab-route
        paths:
          - /ab # http://localhost:8000/ab
        strip_path: true
    plugins:
      - name: jwt
        config:
          uri_param_names:
            - jwt
          claims_to_verify:
            - exp
          key_claim_name: iss
          secret_is_base64: false

  - name: gateway-marketplace
    url: http://host.docker.internal:3300
    routes:
      - name: gateway-marketplace-route
        paths:
          - /marketplace # http://localhost:8000/marketplace
        strip_path: true
    plugins:
      - name: jwt
        config:
          uri_param_names:
            - jwt
          claims_to_verify:
            - exp
          key_claim_name: iss
          secret_is_base64: false